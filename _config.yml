# Site identity
title: zchhaa | AI × Electromagnetics
description: 通信工程硕士研究生的个人主页，记录天线、射频、电磁仿真、HFSS / PyAEDT 与 AI 辅助工程设计。
url: "https://zhouh406.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

author:
  name: zchhaa
  email: zhouh268@mail2.sysu.edu.cn

# Keep the existing GitHub Pages / Jekyll architecture.
remote_theme: jekyll/minima
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

# Markdown-driven content collections.
collections:
  projects:
    output: true
    permalink: /projects/:name/
  knowledge:
    output: true
    permalink: /knowledge/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: knowledge
    values:
      layout: note
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - .idea
  - .github
  - CONTENT_GUIDE.md
  - LICENSE
  - README.md
