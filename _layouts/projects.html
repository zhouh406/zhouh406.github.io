---
layout: default
---
<div class="shell page-shell">
  <header class="page-header">
    <p class="eyebrow">Selected engineering work</p>
    <h1>{{ page.title }}</h1>
    <p class="page-lead">{{ page.description }}</p>
  </header>
  {% if content != '' %}<article class="prose page-intro">{{ content }}</article>{% endif %}
  {% assign projects = site.projects | sort: 'order' %}
  <div class="card-grid card-grid--projects project-index">
    {% for project in projects %}{% include project-card.html project=project %}{% endfor %}
  </div>
</div>
