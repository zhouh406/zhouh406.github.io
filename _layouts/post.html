---
layout: default
---
<div class="shell detail-shell note-shell">
  <a class="back-link" href="{{ '/knowledge/' | relative_url }}"><span aria-hidden="true">←</span> Knowledge</a>
  <header class="detail-header note-header">
    <div class="detail-header__main">
      <div class="note-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time></div>
      <h1>{{ page.title }}</h1>
      {% if page.excerpt %}<p class="page-lead">{{ page.excerpt | strip_html }}</p>{% endif %}
    </div>
  </header>
  <article class="prose note-content">{{ content }}</article>
</div>
